name: packs

# Every pack of this repository checks clean and embeds the engine's own copy of each ontology it
# carries, at the engine release pinned here: move the pin and `oto pack refresh` together.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  packs:
    name: packs check clean and match the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The engine, at its release
        run: python -m pip install --upgrade pip && python -m pip install "oto-kg @ git+https://github.com/Cynergis/oto@v0.11.17" pytest
      - name: Packs
        run: python -m pytest -q tests/test_packs.py
