<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The specification</title>
<link rel="stylesheet" href="../_studio/studio.css">
<style>
.spec-toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; padding: 0; list-style: none; font-size: 14px; }
.spec-toc a { color: var(--st-muted); }
.spec-section { scroll-margin-top: 72px; }
.spec-item { scroll-margin-top: 72px; }
.spec-item h3 { margin: 0 0 4px; }
.spec-facts { color: var(--st-muted); font-size: 15px; margin: 6px 0 0; }
.spec-tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--st-line);
            color: var(--st-muted); margin-right: 6px; }
.spec-tag.must { color: var(--st-accent); border-color: var(--st-accent); }
.spec-steps { margin: 8px 0 0; padding-left: 22px; }
.spec-gwt p { margin: 2px 0; }
dl.spec-terms dt { font-weight: 600; margin-top: 10px; }
dl.spec-terms dd { margin: 2px 0 0; }
</style>
<script src="../_studio/data.js"></script>
<script src="../_studio/studio.js"></script>
<script src="data.js"></script>
</head>
<body>
<main class="studio-page" id="spec">
  <h1 id="title">The specification</h1>
  <p class="studio-lead" id="lead"></p>
  <ul class="spec-toc" id="toc"></ul>
  <div id="sections"></div>
  <div id="studio-open"></div>
</main>
<script src="app.js"></script>
</body>
</html>
