<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --line:#e2e8f0;
    --ink:#020817; --muted:#475569; --soft:#94a3b8;
    --accent:#2563eb; --accent2:#7c3aed; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --chip:#f1f5f9;
    --radius:12px; --radius-sm:8px;
    --sh-sm:0 1px 2px 0 rgba(9,9,11,.05);
    --sh-md:0 4px 14px -4px rgba(9,9,11,.10),0 2px 6px -3px rgba(9,9,11,.06);
    --sh-lg:0 24px 56px -16px rgba(9,9,11,.22),0 8px 20px -10px rgba(9,9,11,.16);
    font-family:'Geist','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;font-family:inherit;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .app{display:grid;grid-template-columns:268px 1fr;height:100vh;letter-spacing:-0.006em}

  /* Sidebar */
  .side{background:#f8fafc;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:14.5px;margin:0;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:-0.01em}
  .brand .logo{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#2563eb;color:#fff;flex:none;box-shadow:var(--sh-sm)}
  .brand .logo svg{width:16px;height:16px}
  .brand p{margin:9px 0 0;color:var(--soft);font-size:11.5px;font-weight:450}
  .docsel{display:flex;gap:2px;background:var(--chip);border-radius:9px;padding:3px;margin-top:13px}
  .docsel button{flex:1;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--muted);padding:6px;border-radius:6px;transition:.12s;letter-spacing:-0.01em}
  .docsel button:hover{color:var(--ink)}
  .docsel button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-sm);font-weight:600}
  .nav{padding:10px 10px;overflow:auto;flex:1;min-height:0}
  .navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:1px;border:1px solid transparent;transition:.1s;letter-spacing:-0.01em}
  .navitem:hover{background:var(--panel2);color:var(--ink)}
  .navitem.active{background:#eff6ff;color:#1d4ed8;font-weight:550}
  .navitem .ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
  .navitem.active .ico{color:var(--accent)}
  .navitem .ico svg{width:16px;height:16px;display:block}
  .navitem .lab{flex:1}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.empty{background:#cbd5e1}
  .dot.partial{background:var(--warn)}
  .dot.done{background:var(--good)}
  .side .foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--soft);line-height:1.55}
  .side .foot a{color:var(--accent);text-decoration:none}

  /* Main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{padding:0 28px;height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px)}
  .crumb{font-size:12.5px;color:var(--soft);font-weight:450;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumb b{color:var(--ink);font-weight:600}
  .progwrap{flex:1;max-width:300px}
  .progwrap .lab{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;white-space:nowrap;margin-bottom:5px;font-weight:450}
  .progbar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden}
  .progbar i{display:block;height:100%;background:var(--accent);width:0;transition:.4s;border-radius:99px}
  .canvas{padding:28px 32px 64px;overflow:auto;flex:1;min-height:0}
  .head{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
  .head h2{margin:0;font-size:24px;font-weight:650;letter-spacing:-0.022em}
  .head h2 svg{vertical-align:-2px}
  .head .src{font-size:11px;color:var(--soft);background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:99px;margin-top:6px;display:inline-block;font-weight:450}
  .head .sp{flex:1}
  .lead{color:var(--muted);font-size:13.5px;max-width:760px;line-height:1.6;margin:6px 0 22px;font-weight:450;text-wrap:pretty}
  .lead b{color:var(--ink);font-weight:600}
  .empty-note{color:var(--soft);font-size:13px;padding:32px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel)}

  /* Cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;cursor:pointer;transition:.14s;position:relative;box-shadow:var(--sh-sm)}
  .card:hover{border-color:#cbd5e1;box-shadow:var(--sh-md);transform:translateY(-1px)}
  .card h3{margin:0 0 4px;font-size:14.5px;font-weight:600;letter-spacing:-0.012em}
  .card .role{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .card p{margin:9px 0 0;color:var(--muted);font-size:12.7px;line-height:1.55;font-weight:450;text-wrap:pretty}
  .card .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

  /* Badges / tags */
  .tag{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);border:1px solid transparent;font-weight:550;letter-spacing:-0.005em;display:inline-flex;align-items:center;gap:4px;line-height:1.5}
  .tag.b{background:#eff6ff;color:#1d4ed8;border-color:#dbeafe}
  .tag.g{background:#f0fdf4;color:#15803d;border-color:#dcfce7}
  .tag.w{background:#fffbeb;color:#b45309;border-color:#fef3c7}
  .tag.r{background:#fef2f2;color:#dc2626;border-color:#fee2e2}

  /* Overview / blocks grid */
  .ov{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ov .full{grid-column:1/-1}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--sh-sm)}
  .block .k{font-size:11px;text-transform:uppercase;letter-spacing:.045em;color:var(--soft);font-weight:650;margin-bottom:9px}
  .block .v{font-size:14px;line-height:1.65;color:var(--ink);font-weight:450}
  .crit{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
  .crit:first-of-type{border-top:none}
  .crit .num{min-width:34px;height:24px;padding:0 7px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff;flex:none;letter-spacing:.02em}

  /* phases */
  .phases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh-sm)}
  .phase .ph{padding:13px 16px;font-weight:650;font-size:13px;border-bottom:1px solid var(--line);letter-spacing:-0.01em}
  .phase.mvp .ph{background:#f0fdf4;color:#15803d}
  .phase.growth .ph{background:#eff6ff;color:#1d4ed8}
  .phase.vision .ph{background:#faf5ff;color:#7c3aed}
  .phase ul{list-style:none;margin:0;padding:8px}
  .phase li{padding:8px 11px;font-size:12.7px;color:var(--muted);border-radius:7px;display:flex;gap:9px;font-weight:450}
  .phase li::before{content:"";width:5px;height:5px;border-radius:50%;background:#cbd5e1;margin-top:7px;flex:none}

  /* Modal / dialog */
  .overlay{position:fixed;inset:0;background:rgba(9,9,11,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fade .15s ease}
  .overlay.on{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:var(--sh-lg);animation:pop .18s cubic-bezier(.16,1,.3,1)}
  .modal.wide{width:min(880px,100%);max-height:92vh}
  .modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--panel);z-index:2}
  .modal .mh h3{margin:0;font-size:16.5px;flex:1;font-weight:650;letter-spacing:-0.015em}
  .modal .mh .x{cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:7px;line-height:1;border:1px solid transparent;background:none;font-size:19px;display:grid;place-items:center;transition:.12s}
  .modal .mh .x:hover{background:var(--panel2);color:var(--ink)}
  .mb{padding:20px 22px}
  .tracebox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px}
  .tracebox .tl{font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;font-weight:650}
  .tracelink{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);cursor:pointer;background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:7px;margin:0 6px 6px 0;font-weight:500;transition:.12s;box-shadow:var(--sh-sm)}
  .tracelink:hover{border-color:#cbd5e1;background:var(--panel2)}
  .detrow{display:flex;gap:14px;margin-bottom:14px}
  .detrow .dk{width:104px;flex:none;font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;font-weight:650;padding-top:3px}
  .detrow .dv{font-size:13.5px;line-height:1.6;color:var(--ink);font-weight:450}
  .sectionlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:650;margin:26px 0 12px}
  .subtabs{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--chip);border-radius:9px;padding:3px;margin:2px 0 20px}
  .subtab{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:.12s;letter-spacing:-0.01em}
  .subtab:hover{color:var(--ink)}
  .subtab.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-sm);font-weight:600}
  .list{display:flex;flex-direction:column;gap:6px}
  .lrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.12s;box-shadow:var(--sh-sm)}
  .lrow:hover{border-color:#cbd5e1;background:#fcfcfc}
  .lrow .lmain{flex:1;min-width:0}
  .lrow .lt{font-size:13.5px;color:var(--ink);font-weight:500;letter-spacing:-0.01em}
  .lrow .ls{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;font-weight:450}
  .lrow .lmeta{flex:none;white-space:nowrap;display:flex;gap:5px;align-items:center}
  .dtable{width:100%;border-collapse:collapse;font-size:13px}
  .dtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
  .dtable td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink);line-height:1.5;font-weight:450}
  .dtable td.ty{color:var(--muted);font-family:'Geist Mono',ui-monospace,monospace;white-space:nowrap;font-size:12px}
  .dtable tr:last-child td{border-bottom:none}
  .dtable tbody tr{transition:.1s}
  .dtable tbody tr:hover{background:#fcfcfc}
  pre{font-family:'Geist Mono',ui-monospace,monospace}
  .mermaid{font-family:'Geist','Inter',sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#cbd5e1}
</style>
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="engine.js"></script>
</helmet>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"></path><path d="M14 2v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg></span><span id="brandTitle">PRD</span></h1>
      <p id="brandSub">BMAD-structured · read-only</p>
      <div class="docsel" id="docsel"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      Read-only view · built on the<br>BMAD PRD structure.
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">PRD · <b id="crumbName">—</b></div>
      <div class="progwrap">
        <div class="lab"><span>Section coverage</span><span id="progTxt">0%</span></div>
        <div class="progbar"><i id="progFill"></i></div>
      </div>
    </div>
    <div class="canvas" id="canvas"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    const start = Date.now();
    const tick = () => {
      const ready = typeof window.boot === 'function' && window.__PRD__ && window.__ARCH__;
      const mermaidReady = !!window.mermaid;
      // boot once engine+data are ready; wait a little longer for mermaid but don't block forever
      if (ready && (mermaidReady || Date.now() - start > 2500)) {
        try { window.boot(); } catch(e){ console.error('boot failed', e); }
        return;
      }
      if (Date.now() - start > 8000) { if (ready) { try { window.boot(); } catch(e){} } return; }
      setTimeout(tick, 60);
    };
    tick();
  }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
