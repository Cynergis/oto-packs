<head>

<title>Where it runs</title>

<style>
.page-toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; padding: 0; list-style: none; font-size: 14px; }
.page-toc a { color: var(--st-muted); }
section, .studio-card { scroll-margin-top: 72px; }

.facts ul { margin: 2px 0 6px; padding-left: 20px; }
.facts span { display: block; }
.tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--st-line); color: var(--st-muted); margin-right: 6px; }
.tag.on { color: var(--st-accent); border-color: var(--st-accent); }
</style>
